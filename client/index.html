    <!-- Google Identity Services (Official GIS OAuth 2.0 SDK) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Immediate Zero-Orders & Zero-Feedback Fresh Start Purge (Runs before any React app mounts) -->
    <script>
      (function() {
        var CLEAN_KEY = 'smart_canteen_clean_slate_2026_v7';
        if (localStorage.getItem(CLEAN_KEY) !== 'fresh_zero_start') {
          try {
            localStorage.removeItem('smart_canteen_orders');
            localStorage.removeItem('canteen_orders');
            localStorage.removeItem('used_canteen_utrs');
            localStorage.removeItem('smart_canteen_used_item_tokens');
            localStorage.removeItem('smart_canteen_clean_slate_version');
            localStorage.setItem('smart_canteen_orders', '[]');
            localStorage.setItem(CLEAN_KEY, 'fresh_zero_start');
          } catch (e) {}
        }
        var FB_KEY = 'smart_canteen_feedback_clean_2026_v1';
        if (localStorage.getItem(FB_KEY) !== 'wiped_clean') {
          try {
            localStorage.setItem('smart_canteen_feedback', '[]');
            localStorage.setItem(FB_KEY, 'wiped_clean');
          } catch (e) {}
        }
      })();
    </script>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('mits_theme') || 'dark';
          var savedPreset = localStorage.getItem('mits_theme_preset') || 'royal-gold';
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme-preset', savedPreset);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0B132B] font-sans antialiased selection:bg-orange-500 selection:text-white">

  </body>
