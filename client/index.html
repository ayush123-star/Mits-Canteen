        if (localStorage.getItem(ACC_ISOLATE_KEY) !== 'strictly_isolated_v2') {
          try {
            var rawUsers = localStorage.getItem('smart_canteen_users');
            if (rawUsers) {
              var uList = JSON.parse(rawUsers);
              if (Array.isArray(uList)) {
                uList.forEach(function(u) {
                  delete u.aliasEmail;
                });
                localStorage.setItem('smart_canteen_users', JSON.stringify(uList));
              }
            }
            var rawActive = localStorage.getItem('smart_canteen_active_user');
            if (rawActive) {
              var actU = JSON.parse(rawActive);
              if (actU && actU.aliasEmail) {
                delete actU.aliasEmail;
                localStorage.setItem('smart_canteen_active_user', JSON.stringify(actU));
              }
            }
            var rawOrders = localStorage.getItem('smart_canteen_orders');
            var ordList = [];
            if (rawOrders) {
              try { ordList = JSON.parse(rawOrders) || []; } catch (_) {}
            }
            if (!Array.isArray(ordList) || ordList.length === 0) {
              ordList = CANONICAL_ORDERS;
            } else {
              // Normalize existing orders
              ordList.forEach(function(o) {
                var roll = String(o.studentRoll || o.studentEnrollment || '').trim().toUpperCase();
                var phone = String(o.studentPhone || '');
                var tok = String(o.tokenNumber || '');
                if (roll === 'PANDEYAYUSH1603' || phone.indexOf('67623') !== -1 || tok.indexOf('152') !== -1) {
                  o.studentEmail = 'pandeyayush1603@gmail.com';
                  o.email = 'pandeyayush1603@gmail.com';
                  o.userEmail = 'pandeyayush1603@gmail.com';
                } else if (roll === 'BTET25O1039' || roll === 'BTET2501039' || phone.indexOf('43210') !== -1 || tok.indexOf('151') !== -1) {
                  o.studentEmail = '25et1ay39@mitsgwl.ac.in';
                  o.email = '25et1ay39@mitsgwl.ac.in';
                  o.userEmail = '25et1ay39@mitsgwl.ac.in';
                }
              });
              // Ensure both canonical orders are present
              CANONICAL_ORDERS.forEach(function(co) {
                if (!ordList.some(function(o) { return o.tokenNumber === co.tokenNumber; })) {
                  ordList.push(co);
                }
              });
            }
            localStorage.setItem('smart_canteen_orders', JSON.stringify(ordList));
            localStorage.setItem(ACC_ISOLATE_KEY, 'strictly_isolated_v2');
          } catch(e) {}
        }
      })();

    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('mits_theme') || 'dark';
          var savedPreset = localStorage.getItem('mits_theme_preset') || 'royal-gold';
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme-preset', savedPreset);
        } catch(e) {}
      })();
